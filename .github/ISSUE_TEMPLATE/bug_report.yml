name: Bug report
description: Something does not install, capture or recall as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12.4
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: AI app
      multiple: true
      options: [Claude Code, Claude Desktop, Codex, other]
  - type: textarea
    id: log
    attributes:
      label: Error output
      description: Installer output, or ~/.graph-mind/automatic-capture/status.json. Remove anything private first.
      render: text
