name: publish

# A version tag (v0.1.0) builds the package, publishes it to PyPI through trusted publishing
# (no token stored anywhere), then lists it in the MCP Registry, authenticated by GitHub OIDC.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version tag matches pyproject.toml and server.json
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          grep -q "^version = \"$TAG\"" pyproject.toml
          python -c "import json,sys; d=json.load(open('server.json')); sys.exit(not (d['version']=='$TAG'==d['packages'][0]['version']))"
      - name: Build
        run: python -m pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Wait until PyPI serves the release
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/graph-mind-memory/${GITHUB_REF#refs/tags/v}/json" > /dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Publish to the MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
