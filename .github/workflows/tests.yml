name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "47 21 * * 1"          # Tuesdays 06:47 in Korea: newest dependencies, unchanged code
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: on 26.04 the bundled Postgres misses libxml2.so.2
        os: [windows-latest, ubuntu-24.04, macos-latest]
        python: ["3.12"]
        include:                     # newest Python, and a 64-bit ARM machine (a NAS, a Pi)
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-24.04
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: python -m pip install ruff && ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Research tests
        run: python -m unittest discover -s research/tests -p "test_*.py"
      - name: Self-checks
        run: |
          python -m graph_mind.vector_cache
          python -m graph_mind.sharing
          python -m graph_mind.warmup
