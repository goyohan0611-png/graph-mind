name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "47 21 * * 1"          # Tuesdays 06:47 in Korea: newest dependencies, unchanged code
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:                     # newest Python, and a 64-bit ARM machine (a NAS, a Pi)
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Self-checks
        run: |
          python src/vector_cache.py
          python src/brain_log.py
          python src/embedding_warmup.py
