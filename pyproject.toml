[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turnbook"
version = "0.10.3"
description = "Local long-term memory for AI agents: every conversation word for word, on your own PC, shared by all your agents, nothing spent to save."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yohan Ko", email = "goyohan0611@gmail.com" }]
keywords = ["mcp", "mcp-server", "memory", "agent-memory", "long-term-memory", "claude", "claude-code",
            "codex", "cursor", "gemini-cli", "copilot", "opencode", "llm", "longmemeval",
            "local-first", "rag", "retrieval", "hybrid-search", "semantic-search",
            "conversational-memory", "chatbot-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2,<3",
    "numpy",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "psycopg[binary]>=3.2",
    "cryptography",          # seals lines on a shared hub
    "psutil",
    "fasteners",
    "platformdirs",          # where the hub's Postgres programs are kept (fetched once)
]

[project.urls]
Homepage = "https://github.com/goyohan0611-png/turnbook"
Issues = "https://github.com/goyohan0611-png/turnbook/issues"
Changelog = "https://github.com/goyohan0611-png/turnbook/blob/main/CHANGELOG.md"

[project.scripts]
turnbook = "graph_mind.mcp_server:main"
turnbook-install = "graph_mind.install:main"
turnbook-uninstall = "graph_mind.install:uninstall"
turnbook-capture = "graph_mind.capture_cli:main"
turnbook-forget = "graph_mind.forget:main"
turnbook-view = "graph_mind.memory_view:main"
turnbook-hub = "graph_mind.project_brains:hub_main"
# the names before 0.9.44, still in apps' configs, hooks and Startup entries
graph-mind = "graph_mind.mcp_server:main"
graph-mind-install = "graph_mind.install:main"
graph-mind-uninstall = "graph_mind.install:uninstall"
graph-mind-capture = "graph_mind.capture_cli:main"
graph-mind-forget = "graph_mind.forget:main"
graph-mind-view = "graph_mind.memory_view:main"
graph-mind-hub = "graph_mind.project_brains:hub_main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["graph_mind"]
# where apps registered before 0.8 start the server and the capture service (gone in 0.9)
py-modules = ["graph_mind_mcp_server", "automatic_capture_cli"]

[tool.setuptools.package-data]
graph_mind = ["opencode_plugin.js"]     # installed into OpenCode by turnbook-install

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["research"]   # experiments and benchmarks, kept as they were run

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
from-first = true
known-first-party = ["graph_mind"]

[tool.ruff.lint.per-file-ignores]
"src/graph_mind/memory_view.py" = ["E501"]   # the page's HTML and JavaScript, kept readable as is
"tests/*" = ["I001"]          # each test imports _isolate first, before anything it isolates
