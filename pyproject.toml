[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mind-memory"
version = "0.7.0"
description = "Local-first memory for AI coding assistants: verbatim, on your own PC, no LLM calls at write time."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yohan Ko", email = "goyohan0611@gmail.com" }]
keywords = ["mcp", "memory", "claude", "codex", "llm", "longmemeval", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2,<3",
    "numpy",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "psycopg[binary]>=3.2",
    "cryptography",          # seals lines on a shared hub
    "psutil",
    "fasteners",
    "platformdirs",          # where the hub's Postgres programs are kept (fetched once)
]

[project.urls]
Homepage = "https://github.com/goyohan0611-png/graph-mind"
Issues = "https://github.com/goyohan0611-png/graph-mind/issues"
Changelog = "https://github.com/goyohan0611-png/graph-mind/blob/main/CHANGELOG.md"

[project.scripts]
graph-mind = "graph_mind_mcp_server:main"
graph-mind-install = "install:main"
graph-mind-uninstall = "install:uninstall"
graph-mind-capture = "automatic_capture_cli:main"
graph-mind-forget = "forget:main"
graph-mind-view = "brain_view:main"
graph-mind-hub = "project_ledger:hub_main"

[tool.setuptools]
# ponytail: flat modules under src/; a graph_mind/ package is the upgrade path.
package-dir = { "" = "src" }
py-modules = [
    "associative_memory",
    "automatic_capture",
    "automatic_capture_cli",
    "brain_log",
    "brain_view",
    "clock",
    "coding_memory",
    "conversation_memory",
    "development_memory",
    "development_paths",
    "embedding_warmup",
    "entity_timeline",
    "forget",
    "graph_mind_mcp_server",
    "install",
    "local_brain",
    "local_embedder",
    "project_ledger",
    "semantic_llm_extractor",
    "semantic_memory",
    "semantic_recall",
    "temporal_resolver",
    "universal_personal_memory",
    "vector_cache",
]
