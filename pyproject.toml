[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mind-memory"
version = "0.1.4"
description = "Local-first memory for AI coding assistants: verbatim, on your own PC, no LLM calls at write time."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yohan Ko", email = "goyohan0611@gmail.com" }]
keywords = ["mcp", "memory", "claude", "codex", "llm", "longmemeval", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2,<3",
    "mcp>=2,<3",
    "numpy",
    "transformers",
    "tiktoken",
    # hosts the shared brain's Postgres; built for Python 3.9-3.12 only. Joining another PC's
    # brain (psycopg) and everything else work on any supported Python.
    "pgserver; python_version < '3.13'",
    "psycopg[binary]",
    "psutil",
    "fasteners",
]

[project.urls]
Homepage = "https://github.com/goyohan0611-png/graph-mind"
Issues = "https://github.com/goyohan0611-png/graph-mind/issues"

[project.scripts]
graph-mind = "graph_mind_mcp_server:main"
graph-mind-install = "install:main"
graph-mind-capture = "automatic_capture_cli:main"

[tool.setuptools]
# ponytail: flat modules, as in the repository; a graph_mind/ package is the upgrade path.
py-modules = [
    "associative_memory",
    "automatic_capture",
    "automatic_capture_cli",
    "brain_log",
    "clock",
    "coding_memory",
    "conversation_memory",
    "development_memory",
    "development_paths",
    "embedding_warmup",
    "entity_timeline",
    "graph_mind_mcp_server",
    "install",
    "local_brain",
    "local_embedder",
    "semantic_llm_extractor",
    "semantic_memory",
    "semantic_recall",
    "temporal_resolver",
    "universal_personal_memory",
    "vector_cache",
]
