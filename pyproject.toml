[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mind-memory"
version = "0.1.0"
description = "Local-first memory for AI coding assistants: verbatim, on your own PC, no LLM calls at write time."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yohan Ko", email = "goyohan0611@gmail.com" }]
keywords = ["mcp", "memory", "claude", "codex", "llm", "longmemeval", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2,<3",
    "mcp>=2,<3",
    "numpy",
    "transformers",
    "tiktoken",
    "pgserver",
    "psycopg[binary]",
    "psutil",
    "fasteners",
]

[project.urls]
Homepage = "https://github.com/goyohan0611-png/graph-mind"
Issues = "https://github.com/goyohan0611-png/graph-mind/issues"

[project.scripts]
graph-mind = "graph_mind_mcp_server:main"
graph-mind-install = "install:main"
graph-mind-capture = "automatic_capture_cli:main"

[tool.setuptools]
# ponytail: flat modules, as in the repository; a graph_mind/ package is the upgrade once the
# research-phase modules are trimmed out of the product's imports.
py-modules = [
    "associative_memory",
    "automatic_capture",
    "automatic_capture_cli",
    "brain_log",
    "coding_memory",
    "concept_plan_benchmark_v071",
    "conversation_memory",
    "development_memory",
    "development_paths",
    "embedding_warmup",
    "entity_timeline",
    "executable_memory",
    "executable_plan_v2_diagnostic",
    "graph_mind_mcp_server",
    "grounded_concept_bridge_v072",
    "ingestion_gate",
    "ingestion_synonyms",
    "install",
    "llm_concept_planner",
    "local_brain",
    "longmemeval_adapter",
    "longmemeval_ingestion_calibration",
    "longmemeval_ingestion_preflight",
    "longmemeval_ingestion_v7",
    "memory_algebra",
    "memory_contract",
    "memory_normalization",
    "memory_vocabulary",
    "semantic_grounding_v073",
    "semantic_llm_extractor",
    "semantic_memory",
    "semantic_recall",
    "state_relation_contract",
    "temporal_resolver",
    "temporal_state",
    "universal_personal_memory",
    "vector_cache",
]
